name: Deploy to Amazon ECS

on:
  push:
    branches: [dev_1, dev_2]

env:
  AWS_REGION: ap-south-1                  # set this to your preferred AWS region, e.g. us-west-1
  ECR_REPOSITORY: nafed           # set this to your Amazon ECR repository name
  ECS_SERVICE: nafed-ecs-service                 # set this to your Amazon ECS service name
  ECS_CLUSTER: nafed-cluster                 # set this to your Amazon ECS cluster name
  ECS_TASK_DEFINITION: ./.github/ecs.json # set this to the path to your Amazon ECS task definition
                                               # file, e.g. .aws/task-definition.json
  CONTAINER_NAME: nafed-api-container           # set this to the name of the container in the
                                               # containerDefinitions section of your task definition

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: ref
        run: echo ${{secrets.NAME}}
        

      - name: Checkout_1
        if: ${{github.ref == 'refs/heads/dev_1'}}        
        run: echo ${{secrets.NAME}}
        id: asdsad
        

      - name: Checkout_2
        if: ${{github.ref == 'refs/heads/dev_2' }}            
        run: echo ${{secrets.Name1}}
        
      