name: Deploy to Amazon ECS

on:
  push:
    branches:
      - [dev_1, dev_2]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      if: ${{ push.branches == 'dev_1' }}
        - name: Checkout_1
          uses: actions/checkout@v4
      if: ${{ push.branches == 'dev_2' }}    
        - name: Checkout_2
          uses: actions/checkout@v4
      